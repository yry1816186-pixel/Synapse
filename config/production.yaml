# Synapse 生产环境配置

app:
  name: Synapse
  version: 3.0.0
  debug: false

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  database: ${DB_NAME:synapse}
  username: ${DB_USER:synapse}
  password: ${DB_PASSWORD:}
  pool_size: 20

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  db: 0

mqtt:
  host: ${MQTT_HOST:localhost}
  port: ${MQTT_PORT:1883}
  username: ${MQTT_USER:}
  password: ${MQTT_PASSWORD:}
  client_id: synapse_prod

api:
  host: 0.0.0.0
  port: 8000
  debug: false
  cors_origins: []

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
